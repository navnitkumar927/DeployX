stages:
  - build
  - security

variables:
  NODE_VERSION: "22"

# =========================
# FRONTEND BUILD
# =========================
build_frontend:
  stage: build
  tags:
    - deployx
  script:
    - echo "===== FRONTEND BUILD ====="
    - cd frontend
    - npm ci
    - npm run build

# =========================
# BACKEND BUILD
# =========================
build_backend:
  stage: build
  tags:
    - deployx
  script:
    - echo "===== BACKEND BUILD ====="
    - cd backend
    - npm ci
    - npm run build

# =========================
# SONARQUBE
# =========================
sonarqube:
  stage: security
  tags:
    - deployx
  script:
    - echo "===== SONARQUBE SCAN ====="
    - |
      docker run --rm \
        --network host \
        -e SONAR_HOST_URL="$SONAR_HOST_URL" \
        -e SONAR_TOKEN="$SONAR_TOKEN" \
        -v "$CI_PROJECT_DIR:/usr/src" \
        sonarsource/sonar-scanner-cli:latest \
        sonar-scanner \
        -Dsonar.projectKey=DeployX \
        -Dsonar.sources=/usr/src \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN"

# =========================
# OWASP DEPENDENCY CHECK
# =========================
owasp:
  stage: security
  tags:
    - deployx
  script:
    - echo "===== OWASP DEPENDENCY CHECK ====="
    - rm -rf "$CI_PROJECT_DIR/owasp-reports"
    - mkdir -p "$CI_PROJECT_DIR/owasp-reports"
    - |
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        -v owasp_data:/usr/share/dependency-check/data \
        -v "$CI_PROJECT_DIR:/src" \
        owasp/dependency-check:12.2.2 \
        --scan /src \
        --project "DeployX" \
        --format HTML \
        --format XML \
        --out /src/owasp-reports \
        --log /src/owasp-reports/dependency-check.log \
        --noupdate \
        --disableOssIndex \
        --exclude "/src/node_modules/**" \
        --exclude "/src/dist/**" \
        --exclude "/src/owasp-reports/**"
    - echo "===== OWASP REPORTS ====="
    - ls -lah "$CI_PROJECT_DIR/owasp-reports"

  artifacts:
    when: always
    paths:
      - owasp-reports/
    expire_in: 7 days

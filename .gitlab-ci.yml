stages:
  - build
  - security

# =========================
# FRONTEND BUILD
# =========================
build_frontend:
  stage: build
  tags:
    - deployx
  script:
    - echo "===== FRONTEND BUILD ====="
    - npm ci
    - npm run build
    - echo "===== FRONTEND BUILD SUCCESS ====="

# =========================
# BACKEND BUILD
# =========================
build_backend:
  stage: build
  tags:
    - deployx
  script:
    - echo "===== BACKEND BUILD ====="
    - npm ci
    - echo "===== BACKEND BUILD SUCCESS ====="

# =========================
# SONARQUBE
# =========================
sonarqube:
  stage: security
  tags:
    - deployx
  script:
    - echo "===== SONARQUBE SCAN ====="
    - |
      docker run --rm \
        --network host \
        -e SONAR_HOST_URL="$SONAR_HOST_URL" \
        -e SONAR_TOKEN="$SONAR_TOKEN" \
        -v "$CI_PROJECT_DIR:/usr/src" \
        sonarsource/sonar-scanner-cli:latest \
        -Dsonar.projectKey=DeployX \
        -Dsonar.sources=/usr/src/src,/usr/src/server \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN"
    - echo "===== SONARQUBE SUCCESS ====="

# =========================
# OWASP DEPENDENCY CHECK
# =========================
owasp:
  stage: security
  tags:
    - deployx
  script:
    - echo "===== OWASP DEPENDENCY CHECK ====="
    - rm -rf "$CI_PROJECT_DIR/owasp-reports"
    - mkdir -p "$CI_PROJECT_DIR/owasp-reports"
    - |
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        -v owasp_data:/usr/share/dependency-check/data \
        -v "$CI_PROJECT_DIR:/src" \
        owasp/dependency-check:12.2.2 \
        --scan /src/package.json \
        --project "DeployX" \
        --format HTML \
        --format XML \
        --out /src/owasp-reports \
        --log /src/owasp-reports/dependency-check.log \
        --noupdate \
        --disableOssIndex
    - echo "===== OWASP REPORTS ====="
    - ls -lah "$CI_PROJECT_DIR/owasp-reports"

  artifacts:
    when: always
    paths:
      - owasp-reports/
    expire_in: 7 days
